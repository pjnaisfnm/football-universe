<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Football Universe">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0F1C2B">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Football Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a dark scoreboard bar on top; leagues grouped by country; a league opens with its matches
   beside its table on a wide iPad, stacked with a switch on narrow screens. Scores sit in scoreboard tiles. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#E3E9EF; --ink:#0F1C2B; --ink-soft:#495869; --ink-faint:#7B8898; --line:#D2DAE3;
  --bar:#0F1C2B; --bar-ink:#F1F5F9; --bar-soft:#9DAEC0;
  --accent:#1D5BD3; --accent-ink:#FFFFFF; --accent-soft:#DCE6FA;
  --board:#122031; --board-ink:#FFD24A; --board-line:#2A3B52;
  --good:#1B7A4A; --good-soft:#DDF1E6; --warn:#A35F00; --warn-soft:#FBEBD3; --bad:#B22238; --bad-soft:#F8DDE1;
  --b-champ:#E2B11F; --t-champ:#FBF1CC;
  --b-cl:#3E7BE0;    --t-cl:#E1EBFB;
  --b-el:#E9822F;    --t-el:#FCE9DA;
  --b-ecl:#2F9E5F;   --t-ecl:#DDF2E5;
  --b-can:#8257D6;   --t-can:#ECE4FA;
  --b-promo:#2F9E5F; --t-promo:#DDF2E5;
  --b-po:#7CC79A;    --t-po:#EEF8F1;
  --b-rel:#D23A50;   --t-rel:#FBE2E6;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:10px; --chip-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C131B; --surface:#141E29; --surface-2:#1C2835; --ink:#E7EDF3; --ink-soft:#A7B4C2; --ink-faint:#768495; --line:#273444;
    --bar:#060B11; --bar-ink:#EEF3F8; --bar-soft:#8C9DB0;
    --accent:#6F9CFF; --accent-ink:#0B1424; --accent-soft:#1D2D4A;
    --board:#05090E; --board-ink:#FFD24A; --board-line:#22303F;
    --good:#5CC48C; --good-soft:#15291F; --warn:#E5A84A; --warn-soft:#302312; --bad:#F07A8C; --bad-soft:#331A20;
    --b-champ:#E9BD3A; --t-champ:#30290F;
    --b-cl:#5D93F0;    --t-cl:#15233A;
    --b-el:#F0944B;    --t-el:#33220F;
    --b-ecl:#46B677;   --t-ecl:#122A1D;
    --b-can:#9D7BEA;   --t-can:#231B3A;
    --b-promo:#46B677; --t-promo:#122A1D;
    --b-po:#3F8A5F;    --t-po:#0F2018;
    --b-rel:#E8566C;   --t-rel:#331820;
    --chip-ink:#0B1424;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C131B; --surface:#141E29; --surface-2:#1C2835; --ink:#E7EDF3; --ink-soft:#A7B4C2; --ink-faint:#768495; --line:#273444;
  --bar:#060B11; --bar-ink:#EEF3F8; --bar-soft:#8C9DB0;
  --accent:#6F9CFF; --accent-ink:#0B1424; --accent-soft:#1D2D4A;
  --board:#05090E; --board-ink:#FFD24A; --board-line:#22303F;
  --good:#5CC48C; --good-soft:#15291F; --warn:#E5A84A; --warn-soft:#302312; --bad:#F07A8C; --bad-soft:#331A20;
  --b-champ:#E9BD3A; --t-champ:#30290F;
  --b-cl:#5D93F0;    --t-cl:#15233A;
  --b-el:#F0944B;    --t-el:#33220F;
  --b-ecl:#46B677;   --t-ecl:#122A1D;
  --b-can:#9D7BEA;   --t-can:#231B3A;
  --b-promo:#46B677; --t-promo:#122A1D;
  --b-po:#3F8A5F;    --t-po:#0F2018;
  --b-rel:#E8566C;   --t-rel:#331820;
  --chip-ink:#0B1424;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45; padding:0 16px; padding-block:0 48px}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; letter-spacing:.01em}
button,input,select{font-family:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-soft)} .faint{color:var(--ink-faint)}

/* ---------- top bar ---------- */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; margin:0 -16px 18px; background:var(--bar); color:var(--bar-ink); padding:10px 16px 0}
.bar-in{max-width:1180px; margin:0 auto}
.bar-top{display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:space-between}
.brand{display:flex; align-items:baseline; gap:10px}
.brand h1{font-size:26px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; line-height:1}
.season-pill{font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.06em; color:var(--board-ink); border:1px solid var(--board-line); background:var(--board); border-radius:6px; padding:2px 8px}
.save-state{font-size:12.5px; color:var(--bar-soft)}
.save-state.bad{color:#FF9AA8; font-weight:600}
.tabs{display:flex; gap:2px; overflow-x:auto; margin-top:8px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; border:0; background:transparent; color:var(--bar-soft); font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:.04em; text-transform:uppercase; padding:9px 12px 10px; border-bottom:3px solid transparent}
.tab:hover{color:var(--bar-ink)}
.tab[aria-current="page"]{color:var(--bar-ink); border-bottom-color:var(--board-ink)}

.wrap{max-width:1180px; margin:0 auto}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.page-head h2{font-size:32px; font-weight:800; line-height:1.05}
.eyebrow{font-family:var(--display); font-weight:700; font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
.lede{max-width:65ch; color:var(--ink-soft); margin:4px 0 0}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; padding:10px 16px; font-size:15px; font-weight:600; min-height:44px}
.btn:hover{border-color:var(--ink-faint)}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn-danger{background:var(--bad); color:#fff; border-color:var(--bad)}
.btn-small{padding:6px 12px; min-height:36px; font-size:14px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.linkish{border:0; background:none; padding:0; color:var(--accent); font-weight:600; text-decoration:underline; text-underline-offset:3px}
.field{font-size:16px; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:10px 12px; min-height:44px}
.banner{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:var(--warn-soft); color:var(--ink); border:1px solid var(--warn); border-radius:var(--radius); padding:12px 14px; margin-bottom:16px}
.banner.bad{background:var(--bad-soft); border-color:var(--bad)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px}

/* ---------- league list ---------- */
.search-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
.search-row .field{flex:1 1 280px; max-width:520px}
.totals{font-size:14px; color:var(--ink-soft)}
.country{margin-top:22px}
.country h3{font-size:21px; font-weight:700; display:flex; align-items:baseline; gap:10px; padding-bottom:6px; border-bottom:2px solid var(--ink); margin-bottom:10px}
.country h3 .eu{font-family:var(--body); font-size:12.5px; font-weight:500; color:var(--ink-faint)}
.league-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px}
.lcard{display:flex; flex-direction:column; gap:6px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; min-width:0}
.lcard:hover{border-color:var(--ink-faint)}
.lcard .tier{font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint)}
.lcard .name{font-family:var(--display); font-weight:700; font-size:21px; line-height:1.1}
.lcard .leader{font-size:13.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.meter{height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--accent)}
.meter-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-faint)}
.meter-row .meter{flex:1}
.results{display:grid; gap:6px; margin-bottom:8px}
.hit{display:flex; justify-content:space-between; gap:10px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:15px}
.hit span:last-child{color:var(--ink-faint); font-size:13px; text-align:right}

/* ---------- league page ---------- */
.back{margin-bottom:10px}
.seg{display:inline-flex; background:var(--surface-2); border-radius:9px; padding:3px; gap:2px}
.seg button{border:0; background:transparent; border-radius:7px; padding:8px 16px; font-family:var(--display); font-weight:700; font-size:16px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lbody{display:grid; gap:18px; margin-top:14px}
.lbody > *{min-width:0}
.lbody .pane-matches,.lbody .pane-table{display:none}
.lbody[data-pane="matches"] .pane-matches{display:block}
.lbody[data-pane="table"] .pane-table{display:block}
.lbody[data-pane="clubs"] .pane-clubs{display:block}
.pane-clubs{display:none}
@media (min-width:1000px){
  .lbody[data-pane="matches"],.lbody[data-pane="table"]{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .lbody[data-pane="matches"] .pane-table,.lbody[data-pane="table"] .pane-matches{display:block}
  .lbody .pane-table{order:1} .lbody .pane-matches{order:2}
  .seg .only-narrow{display:none}
  .seg.seg-narrow{display:none}
}
.panel-title{font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 8px}

/* round navigator */
.roundnav{display:flex; align-items:center; gap:8px; background:var(--board); color:var(--bar-ink); border-radius:var(--radius); padding:8px; margin-bottom:10px}
.roundnav .arrow{border:1px solid var(--board-line); background:transparent; color:var(--board-ink); border-radius:8px; width:44px; height:44px; font-size:20px; font-weight:700; flex:none}
.roundnav .arrow[disabled]{opacity:.3}
.roundnav .mid{flex:1; text-align:center; min-width:0}
.roundnav select{font-family:var(--display); font-weight:800; font-size:22px; letter-spacing:.06em; text-transform:uppercase; color:var(--board-ink); background:transparent; border:0; text-align:center; text-align-last:center; padding:0 4px; max-width:100%}
.roundnav select option{color:#000; background:#fff}
.roundnav .sub{display:block; font-size:12.5px; color:var(--bar-soft)}
.quick{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-soft); margin:0 0 8px}
.quick input{width:20px; height:20px}

/* matches */
.matches{display:grid; gap:6px}
.match{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) 36px; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:6px 8px}
.match .team{font-weight:600; font-size:15.5px; line-height:1.2; overflow-wrap:anywhere}
.match .home{text-align:right}
.score{display:flex; align-items:center; gap:4px}
.tile{width:48px; height:52px; border-radius:7px; border:1px solid var(--board-line); background:var(--board); color:var(--board-ink); font-family:var(--display); font-weight:800; font-size:28px; text-align:center; padding:0; caret-color:var(--board-ink)}
.tile::placeholder{color:#3A4B60}
.score .dash{font-family:var(--display); font-weight:800; font-size:22px; color:var(--ink-faint)}
.match.done{border-color:var(--line)}
.match.done .team.win{color:var(--ink)}
.match.done .team.lose{color:var(--ink-soft); font-weight:500}
.match.half{border-color:var(--warn); background:var(--warn-soft)}
.match .clear{border:0; background:transparent; color:var(--ink-faint); font-size:20px; width:36px; height:36px; border-radius:6px}
.match .clear:hover{background:var(--surface-2); color:var(--ink)}
.match .clear[hidden]{display:none}
.half-note{grid-column:1/-1; font-size:12.5px; color:var(--warn); text-align:center}
.next-round{margin-top:12px; display:flex; justify-content:flex-end}

/* tables */
.table-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius)}
table.lt{width:100%; border-collapse:collapse; font-size:14.5px; font-variant-numeric:tabular-nums}
.lt th{font-family:var(--display); font-weight:700; font-size:13.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); text-align:center; padding:9px 6px; border-bottom:1px solid var(--line); white-space:nowrap}
.lt th.club{text-align:left}
.lt td{padding:7px 6px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap}
.lt tr:last-child td{border-bottom:0}
.lt td.pos{width:38px; font-weight:700; border-left:5px solid transparent}
.lt td.club{text-align:left; font-weight:600; white-space:normal; min-width:130px}
.lt td.pts{font-weight:800; font-size:16px}
.lt tr.hl td{outline:2px solid var(--accent); outline-offset:-2px}
.form{display:inline-flex; gap:3px}
.form b{display:inline-block; width:18px; height:18px; line-height:18px; border-radius:4px; font-size:11px; font-weight:700; color:var(--chip-ink)}
.form .W{background:var(--good)} .form .D{background:var(--ink-faint)} .form .L{background:var(--bad)}
.band-champ td{background:var(--t-champ)} .band-champ td.pos{border-left-color:var(--b-champ)}
.band-cl td{background:var(--t-cl)}       .band-cl td.pos{border-left-color:var(--b-cl)}
.band-el td{background:var(--t-el)}       .band-el td.pos{border-left-color:var(--b-el)}
.band-ecl td{background:var(--t-ecl)}     .band-ecl td.pos{border-left-color:var(--b-ecl)}
.band-can td{background:var(--t-can)}     .band-can td.pos{border-left-color:var(--b-can)}
.band-promo td{background:var(--t-promo)} .band-promo td.pos{border-left-color:var(--b-promo)}
.band-po td{background:var(--t-po)}       .band-po td.pos{border-left-color:var(--b-po)}
.band-rel td{background:var(--t-rel)}     .band-rel td.pos{border-left-color:var(--b-rel)}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:10px; font-size:13px; color:var(--ink-soft)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:14px; border-radius:3px; display:inline-block}
.tiebreak{font-size:12.5px; color:var(--ink-faint); margin-top:6px}
@media (max-width:620px){ .lt .wide{display:none} }

/* clubs pane */
.club-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px}
.club-list label{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--ink-faint)}

/* european places */
.eu-table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
.eu-table th{font-family:var(--display); font-weight:700; font-size:13.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); padding:8px 6px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap}
.eu-table th:first-child,.eu-table td:first-child,.eu-table th:nth-child(2),.eu-table td:nth-child(2){text-align:left}
.eu-table td{padding:6px; border-bottom:1px solid var(--line); text-align:center}
.eu-table input{width:56px; text-align:center; font-size:16px; border:1px solid var(--line); border-radius:6px; padding:6px 4px; background:var(--surface)}
.eu-table tfoot td{font-weight:700; border-bottom:0}
.dot{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:middle}

/* new season */
.steps{display:grid; gap:14px}
.step h3{font-size:22px; font-weight:700; margin-bottom:6px}
.step .stepno{font-family:var(--display); font-weight:800; color:var(--ink-faint); margin-right:8px}
.move-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:10px; margin-top:8px}
.move{border:1px solid var(--line); border-radius:var(--radius); padding:12px; background:var(--surface); min-width:0}
.move h4{font-family:var(--display); font-size:18px; font-weight:700; margin:0 0 8px}
.move ul{list-style:none; margin:0; padding:0; display:grid; gap:4px}
.move li{display:flex; gap:8px; align-items:center; font-size:14.5px}
.tag{font-family:var(--display); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; border-radius:4px; padding:1px 6px; flex:none}
.tag.up{background:var(--t-promo); color:var(--good)} .tag.down{background:var(--t-rel); color:var(--bad)}
.rules-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13px; color:var(--ink-soft); margin-top:10px}
.rules-row input{width:52px; font-size:16px; text-align:center; border:1px solid var(--line); border-radius:6px; padding:4px; background:var(--surface)}
.move select{font-size:16px; max-width:100%}
.out-row{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:8px; align-items:center; font-size:14.5px}
.out-row input{font-size:16px; width:100%; border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:var(--surface)}
details.unf summary{cursor:pointer; color:var(--accent); font-weight:600}
.ok-line{color:var(--good); font-weight:600}
.warn-line{color:var(--warn); font-weight:600}

/* history */
.hist-season{margin-top:18px}
.champ-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:8px; margin-top:8px}
.champ{display:flex; flex-direction:column; text-align:left; gap:2px; background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--b-champ); border-radius:8px; padding:9px 12px}
.champ .lg{font-size:12.5px; color:var(--ink-faint)}
.champ .cl{font-family:var(--display); font-weight:700; font-size:19px}

/* backup */
.two{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px}
.facts{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14.5px; margin-top:8px}
.facts dt{color:var(--ink-faint)} .facts dd{margin:0; font-weight:600}
.filebtn{position:relative; overflow:hidden; display:inline-flex; align-items:center}
.filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0}


/* ---------- europe ---------- */
.cupbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.cupbtn{display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px 8px 10px; font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:.03em; min-height:44px}
.cupbtn i{width:14px; height:14px; border-radius:50%; display:inline-block}
.cupbtn[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.stages{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; scrollbar-width:thin}
.stage{flex:none; display:flex; flex-direction:column; align-items:flex-start; gap:2px; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 12px; min-width:104px; text-align:left}
.stage .nm{font-family:var(--display); font-weight:700; font-size:17px}
.stage .st{font-size:12px; color:var(--ink-faint)}
.stage[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 -3px 0 var(--ink)}
.stage.done .st{color:var(--good)} .stage.now .st{color:var(--accent); font-weight:600} .stage.wait .st{color:var(--warn)} .stage.skip{opacity:.55}
.ties{display:grid; gap:10px}
.tie{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:8px 10px; display:grid; gap:6px}

<body>


<header class="bar">
  <div class="bar-in">
    <div class="bar-top">
      <div class="brand"><h1>Football Universe</h1><span class="season-pill" id="seasonPill">—</span></div>
      <span class="save-state" id="saveState" aria-live="polite"></span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>

<script>
/* Football Universe engine: pure functions (no DOM). Used by the page and by the node tests. */
var FUE = (function(){
"use strict";
var ROUNDS = ["Q1","Q2","Q3","PO"];
var CUPS = ["cl","el","ecl","can"];
var CUP_NAME = { cl:"Champions League", el:"Europa League", ecl:"Conference League", can:"Canera Cup" };
var LOWER = { cl:"el", el:"ecl", ecl:"can", can:null };
/* Which losers drop to which round of the cup below (Tymek's rules). */
var DROP = {
  cl:  { Q1:"Q2", Q2:"Q3", Q3:"PO", PO:"LP" },
  el:  { Q2:"Q3", Q3:"PO", PO:"LP" },
  ecl: { Q2:"Q3", Q3:"PO", PO:"LP" },
  can: {}
};

/* ---------- random ---------- */
function rng(seed){ // mulberry32; seed optional
  var a = (seed === undefined ? Math.floor(Math.random() * 4294967296) : seed) >>> 0;
  return function(){ a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function shuffle(a, r){ for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* ---------- access list ---------- */
/* template: { cl:[{from,to,places,direct}], ... , target:{cl:36,...}, eps:2 }
   Returns places per country rank for each cup: { cl:[{rank,places,direct}], ... } */
function placesByRank(template, nCountries){
  var out = {};
  CUPS.forEach(function(c){
    var arr = [];
    for(var r = 1; r <= nCountries; r++){
      var band = (template[c] || []).filter(function(b){ return r >= b.from && r <= b.to; })[0];
      arr.push({ rank:r, places: band ? band.places : 0, direct: band ? Math.min(band.direct, band.places) : 0 });
    }
    out[c] = arr;
  });
  return out;
}
/* Solve one cup: how many entrants start at each round so the league phase lands exactly on target.
   N = entrants, D = preferred direct places, inflow = clubs dropping in from the cup above {Q2,Q3,PO,LP}. */
function solveCup(N, D, T, inflow){
  inflow = inflow || {};
  var p2 = inflow.Q2 || 0, p3 = inflow.Q3 || 0, pPO = inflow.PO || 0, pLP = inflow.LP || 0;
  var best = null;
  var order = [];
  for(var d = 0; d <= Math.max(D, T) + 1; d++){ if(D - d >= 0) order.push(D - d); if(d && D + d <= Math.min(N, T)) order.push(D + d); }
  for(var oi = 0; oi < order.length && !best; oi++){
    var eLP = order[oi];
    if(eLP > N || eLP + pLP > T) continue;
    var W = T - eLP - pLP;          // winners needed from the play-off round
    var fPO = 2 * W;
    var rest = N - eLP;
    for(var ePO = Math.min(rest, fPO - pPO); ePO >= 0 && !best; ePO--){
      var w3 = fPO - pPO - ePO;      // Q3 winners needed
      if(w3 < 0) continue;
      var f3 = 2 * w3;
      for(var e3 = Math.min(rest - ePO, f3 - p3); e3 >= 0 && !best; e3--){
        var w2 = f3 - p3 - e3; if(w2 < 0) continue;
        var f2 = 2 * w2;
        for(var e2 = Math.min(rest - ePO - e3, f2 - p2); e2 >= 0 && !best; e2--){
          var w1 = f2 - p2 - e2; if(w1 < 0) continue;
          var e1 = rest - ePO - e3 - e2;
          if(e1 !== 2 * w1) continue;
          best = { LP:eLP, PO:ePO, Q3:e3, Q2:e2, Q1:e1, fields:{ Q1:e1, Q2:f2, Q3:f3, PO:fPO }, inflow:{ Q2:p2, Q3:p3, PO:pPO, LP:pLP }, direct:eLP, wanted:D };
        }
      }
    }
  }
  return best;
}
/* Solve all four cups in order, passing losers down. counts = {cl:{N,D},...}, target = {cl:36,...} */
function solveAll(counts, target){
  var res = {}, inflow = { cl:{}, el:{}, ecl:{}, can:{} };
  for(var i = 0; i < CUPS.length; i++){
    var c = CUPS[i];
    var s = solveCup(counts[c].N, counts[c].D, target[c], inflow[c]);
    if(!s) return { ok:false, failed:c, partial:res };
    res[c] = s;
    var low = LOWER[c];
    if(low){
      Object.keys(DROP[c]).forEach(function(rd){
        var losers = s.fields[rd] / 2, to = DROP[c][rd];
        inflow[low][to] = (inflow[low][to] || 0) + losers;
      });
    }
  }
  return { ok:true, cups:res };
}

/* ---------- ties (two legs) ---------- */
/* tie = { a, b, s:[a1,b1,b2,a2] | null, pen: winnerId|null } ; leg 1 at a's ground, leg 2 at b's */
function tieWinner(t){
  if(!t || !t.b) return t ? t.a : null;        // bye
  if(!t.s || t.s.some(function(x){ return x === null || x === undefined; })) return null;
  var A = t.s[0] + t.s[3], B = t.s[1] + t.s[2];
  if(A > B) return t.a; if(B > A) return t.b;
  return t.pen === t.a || t.pen === t.b ? t.pen : null;
}
function tieLoser(t){ var w = tieWinner(t); if(!w || !t.b) return null; return w === t.a ? t.b : t.a; }
function tieLevel(t){ return !!(t && t.b && t.s && t.s.every(function(x){ return x !== null && x !== undefined; }) && t.s[0] + t.s[3] === t.s[1] + t.s[2]); }

/* ---------- qualifying draw ---------- */
/* teams: [{id, country, coef}] -> ties. Seeded half v unseeded half, no same-country ties when avoidable.
   Odd field: the top seed gets a bye. */
function drawRound(teams, r){
  r = r || rng();
  var list = teams.slice().sort(function(x, y){ return (y.coef - x.coef) || (x.id < y.id ? -1 : 1); });
  var ties = [];
  if(list.length % 2 === 1){ ties.push({ a:list[0].id, b:null, s:null, pen:null, bye:true }); list = list.slice(1); }
  var half = list.length / 2, seeded = list.slice(0, half), unseeded = list.slice(half);
  for(var attempt = 0; attempt < 400; attempt++){
    var u = shuffle(unseeded.slice(), r), ok = true;
    if(attempt < 300) for(var i = 0; i < half; i++) if(seeded[i].country && seeded[i].country === u[i].country){ ok = false; break; }
    if(!ok) continue;
    for(var k = 0; k < half; k++){
      var homeFirst = r() < 0.5;
      ties.push({ a: homeFirst ? seeded[k].id : u[k].id, b: homeFirst ? u[k].id : seeded[k].id, s:null, pen:null });
    }
    break;
  }
  return shuffle(ties, r);
}

/* ---------- league phase ---------- */
/* template = [[mw, slotHome, slotAway], ...] with slots 0..n-1 where slot s is in pot floor(s/(n/4)).
   teams = [{id, country, pot}] (pot 1..4, n/4 per pot). Places clubs into slots, avoiding same-country
   meetings and more than 2 opponents from one country. Returns fixtures [[mw, hiTeamIndex, awTeamIndex, null, null]]. */
function leagueDraw(teams, template, r){
  r = r || rng();
  var n = teams.length, per = n / 4;
  var byPot = [[],[],[],[]];
  teams.forEach(function(t, i){ byPot[t.pot - 1].push(i); });
  if(byPot.some(function(p){ return p.length !== per; })) return null;
  var opp = []; for(var s = 0; s < n; s++) opp.push([]);
  template.forEach(function(m){ opp[m[1]].push(m[2]); opp[m[2]].push(m[1]); });
  function cost(slotTeam){
    var c = 0;
    for(var s = 0; s < n; s++){
      var me = teams[slotTeam[s]], cnt = {};
      opp[s].forEach(function(o){
        var t = teams[slotTeam[o]];
        if(t.country && t.country === me.country) c += 10;
        if(t.country){ cnt[t.country] = (cnt[t.country] || 0) + 1; if(cnt[t.country] > 2) c += 1; }
      });
    }
    return c;
  }
  var best = null, bestCost = Infinity;
  for(var restart = 0; restart < 30 && bestCost > 0; restart++){
    var slotTeam = [];
    for(var p = 0; p < 4; p++){ var ids = shuffle(byPot[p].slice(), r); for(var q = 0; q < per; q++) slotTeam[p * per + q] = ids[q]; }
    var cur = cost(slotTeam);
    for(var it = 0; it < 4000 && cur > 0; it++){
      var pot = Math.floor(r() * 4), a = pot * per + Math.floor(r() * per), b = pot * per + Math.floor(r() * per);
      if(a === b) continue;
      var t = slotTeam[a]; slotTeam[a] = slotTeam[b]; slotTeam[b] = t;
      var nc = cost(slotTeam);
      if(nc <= cur || r() < 0.002){ cur = nc; } else { t = slotTeam[a]; slotTeam[a] = slotTeam[b]; slotTeam[b] = t; }
    }
    if(cur < bestCost){ bestCost = cur; best = slotTeam.slice(); }
  }
  var flip = r() < 0.5, mwOrder = shuffle(Array.from({ length: Math.max.apply(null, template.map(function(m){ return m[0]; })) }, function(_, i){ return i + 1; }), r);
  var fx = template.map(function(m){
    var h = best[m[1]], a = best[m[2]];
    return [mwOrder[m[0] - 1], flip ? a : h, flip ? h : a, null, null];
  });
  fx.sort(function(x, y){ return x[0] - y[0]; });
  return { fixtures:fx, conflicts:bestCost };
}
function leagueTable(teamIds, fixtures, nameOf){
  var rows = teamIds.map(function(id, i){ return { i:i, id:id, P:0, W:0, D:0, L:0, GF:0, GA:0, GD:0, Pts:0, name: nameOf ? nameOf(id) : id }; });
  fixtures.forEach(function(f){
    if(f[3] === null || f[3] === undefined) return;
    var h = rows[f[1]], a = rows[f[2]];
    [[h, f[3], f[4]], [a, f[4], f[3]]].forEach(function(x){
      var t = x[0]; t.P++; t.GF += x[1]; t.GA += x[2];
      if(x[1] > x[2]) t.W++; else if(x[1] === x[2]) t.D++; else t.L++;
    });
  });
  rows.forEach(function(t){ t.GD = t.GF - t.GA; t.Pts = 3 * t.W + t.D; });
  rows.sort(function(x, y){ return (y.Pts - x.Pts) || (y.GD - x.GD) || (y.GF - x.GF) || (y.W - x.W) || String(x.name).toLowerCase().localeCompare(String(y.name).toLowerCase()); });
  return rows;
}

/* ---------- knockout bracket (2024/25 format) ---------- */
/* standings: ordered team ids (1st..). Play-off: 9/10 v 23/24, 11/12 v 21/22, 13/14 v 19/20, 15/16 v 17/18.
   Last 16: 1/2 v winners of 15/16-17/18 tie, 3/4 v 13/14-19/20, 5/6 v 11/12-21/22, 7/8 v 9/10-23/24.
   Seeded club plays the second leg at home. */
function knockoutPlayoff(stand, r){
  r = r || rng();
  var pairs = [[9,10,23,24],[11,12,21,22],[13,14,19,20],[15,16,17,18]], ties = [];
  pairs.forEach(function(p){
    var seeds = r() < 0.5 ? [p[0], p[1]] : [p[1], p[0]], uns = r() < 0.5 ? [p[2], p[3]] : [p[3], p[2]];
    for(var k = 0; k < 2; k++) ties.push({ a: stand[uns[k] - 1], b: stand[seeds[k] - 1], s:null, pen:null, seeded: seeds[k], slot: p.join("-") + "#" + k });
  });
  return ties;
}
function roundOf16(stand, poTies, r){
  r = r || rng();
  // which play-off ties feed which top-8 pair
  var feed = { "1-2":"15-16-17-18", "3-4":"13-14-19-20", "5-6":"11-12-21-22", "7-8":"9-10-23-24" };
  var ties = [];
  [[1,2],[3,4],[5,6],[7,8]].forEach(function(pp){
    var key = pp.join("-"), src = poTies.filter(function(t){ return t.slot.indexOf(feed[key] + "#") === 0; });
    var winners = src.map(tieWinner);
    var tops = r() < 0.5 ? [pp[0], pp[1]] : [pp[1], pp[0]];
    for(var k = 0; k < 2; k++) ties.push({ a: winners[k], b: stand[tops[k] - 1], s:null, pen:null, path: key });
  });
  return ties;
}
function nextRound(prevTies){
  var ties = [];
  for(var i = 0; i < prevTies.length; i += 2) ties.push({ a: tieWinner(prevTies[i]), b: tieWinner(prevTies[i + 1]), s:null, pen:null });
  return ties;
}

/* ---------- coefficients ---------- */
/* points: win 2, draw 1; qualifying matches count half. Bonuses per cup (2024/25 rules); Canera at half value of ECL. */
var BONUS = {
  cl:  { part:6, perPlace:[0.25, 0.25], max:6, ko:1.5 },
  el:  { part:0, perPlace:[0.25, 0.25], max:6, ko:1.0 },
  ecl: { part:0, perPlace:[0.25, 0.125], max:4, ko:0.5 },
  can: { part:0, perPlace:[0.125, 0.0625], max:2, ko:0.25 }
};
function matchPoints(gf, ga, qual){ var p = gf > ga ? 2 : gf === ga ? 1 : 0; return qual ? p / 2 : p; }
/* league-phase position bonus: 1st gets max, falling by perPlace[0] for places 1-8 and perPlace[1] after, to 0. */
function placeBonus(cup, pos, n){
  var b = BONUS[cup];
  if(cup === "cl" || cup === "el") return Math.max(0, b.max - (pos - 1) * b.perPlace[0] * (36 / n));
  var v = pos <= 8 ? b.max - (pos - 1) * b.perPlace[0] : b.max - 7 * b.perPlace[0] - (pos - 8) * b.perPlace[1];
  return Math.max(0, v);
}
function trunc3(x){ return Math.floor(x * 1000 + 1e-9) / 1000; }

return { ROUNDS:ROUNDS, CUPS:CUPS, CUP_NAME:CUP_NAME, LOWER:LOWER, DROP:DROP, rng:rng, shuffle:shuffle,
  placesByRank:placesByRank, solveCup:solveCup, solveAll:solveAll,
  tieWinner:tieWinner, tieLoser:tieLoser, tieLevel:tieLevel, drawRound:drawRound,
  leagueDraw:leagueDraw, leagueTable:leagueTable, knockoutPlayoff:knockoutPlayoff, roundOf16:roundOf16, nextRound:nextRound,
  BONUS:BONUS, matchPoints:matchPoints, placeBonus:placeBonus, trunc3:trunc3 };

  return wrap;
}
function markBackedUp(){ S.meta.lastBackupAt = Date.now(); S.meta.changesSinceBackup = 0; writeNow(); toast("Backup saved"); }
function saveBackup(after){
  writeNow();
  var name = "football-universe-backup-" + stamp() + ".json", text = JSON.stringify(S);
  function done(){ markBackedUp(); if(after) after(); }
  if(downloads){
    downloads.save({ filename:name, data:text }).then(done).catch(function(e){
      if(e && e.code === "declined") return;
      dialog({ title:"Backup not saved", body:h("p", null, (e && e.message) || "The file could not be saved."), cancel:null });
    });
    return;
  }
  try {
    var file = new File([text], name, { type:"application/json" });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ files:[file], title:"Football Universe backup" }).then(done).catch(function(err){
        if(err && err.name === "AbortError") return;
        linkDownload(name, text, done);
      });
      return;
    }
  } catch(e){}
  linkDownload(name, text, done);
}
function linkDownload(name, text, done){
  try {
    var url = URL.createObjectURL(new Blob([text], { type:"application/json" }));
    var a = h("a", { href:url, download:name, style:"display:none" });
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 1500);
    done();
  } catch(e){
    dialog({ title:"Backup not saved", body:h("p", null, "This browser can't save files from the page."), cancel:null });
  }
}
function fileButton(label, onFile){
  var inp = h("input", { type:"file", accept:".json,application/json", "aria-label":label });
  inp.addEventListener("change", function(){ var f = inp.files && inp.files[0]; if(f) onFile(f); inp.value = ""; });
  return h("span", { class:"btn filebtn" }, label, inp);
}
function loadFromFile(file){
  var fr = new FileReader();
  fr.onload = function(){
    var d = null; try { d = JSON.parse(fr.result); } catch(e){}
    if(!valid(d)){ dialog({ title:"That isn't a Football Universe file", body:h("p", null, "Choose football-universe-start.json or a file made with Save a backup."), cancel:null }); return; }
    var played = 0; d.leagues.forEach(function(l){ l.fixtures.forEach(function(f){ if(f[3] !== null) played++; }); });
    var body = h("div", null,
      h("p", null, "Season " + d.season.label + " · " + plural(d.leagues.length, "league") + " · " + plural(played, "league result") + (d.meta && d.meta.lastBackupAt ? " · saved " + when(d.meta.lastBackupAt) : "")),
      S ? h("p", { class:"warn-line" }, "This replaces everything on this device.") : null);
    dialog({ title:S ? "Replace everything with this file?" : "Load this file?", ok:S ? "Replace" : "Load", danger:!!S, body:body, onOk:function(){
      S = migrate(d); index(); REV++; writeNow(); askPersist(); ui.round = {}; ui.ns = null; ui.stage = null; go("leagues"); toast("Loaded");
    } });
  };
  fr.readAsText(file);
}

/* ---------------- start ---------------- */
function boot(){
  var stored = readStore();
  if(valid(stored)){ S = migrate(stored); }
  else if(!stored && window.FU_SEED && valid(window.FU_SEED)){ S = migrate(JSON.parse(JSON.stringify(window.FU_SEED))); writeNow(); }
  if(S){ index(); askPersist(); setSaveState(storageOK ? "Saved on this device" : "Not saved — device storage problem", !storageOK); }
  render();
  try {
    if(window.claude && typeof window.claude.use === "function"){
      window.claude.use("downloads").then(function(d){ downloads = d; }).catch(function(){});
    }
  } catch(e){}
}
window.__fu = { table:function(id){ return table(L[id]); }, data:function(){ return S; }, seasonPoints:seasonPoints, liveRanking:liveRanking, liveAccess:liveAccess,
  fieldOf:fieldOf, lpStandings:lpStandings, clubCoefStart:clubCoefStart, cupChampion:cupChampion, render:function(){ REV++; render(); }, planSeason:planSeason, startSeason:startSeason };
boot();

})();
